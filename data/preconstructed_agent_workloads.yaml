schema_version: 2
status: preconstructed_reference
token_distribution:
  family: truncated_lognormal
  parameterization: p50_p95
  sigma_formula: log(p95 / p50) / 1.645
  llm_node_fields: [input_tokens, output_tokens]
  context_update: P_next = min(context_window, P_current + O_current + returned_tool_tokens + stage_overhead)

applications:
  interactive_rag:
    label: Retrieval-Augmented Interactive Agent
    slo_class: latency_sensitive
    request_anchors:
      user_input_tokens: {p50: 27, p95: 391}
      final_output_tokens: {p50: 225, p95: 1024}
    nodes:
      plan: {type: llm, input_tokens: {p50: 96, p95: 480}, output_tokens: {p50: 40, p95: 128}}
      direct_answer: {type: llm, input_tokens: {p50: 140, p95: 650}, output_tokens: {p50: 320, p95: 1024}}
      dense_retrieval: {type: stateless_service, mean_service_seconds: 0.04, return_tokens: {p50: 700, p95: 1800}}
      hybrid_search: {type: stateless_service, mean_service_seconds: 0.85, return_tokens: {p50: 1000, p95: 3000}}
      evidence: {type: llm, input_tokens: {p50: 1450, p95: 3800}, output_tokens: {p50: 96, p95: 300}}
      final: {type: llm, input_tokens: {p50: 1720, p95: 4800}, output_tokens: {p50: 320, p95: 1024}}
    choices:
      - llm_node: plan
        options:
          - {probability: 0.15, chains: [[direct_answer]]}
          - {probability: 0.55, chains: [[dense_retrieval, evidence, final]]}
          - {probability: 0.30, chains: [[hybrid_search, evidence, final]]}

  transactional_tool:
    label: Transactional Tool Agent
    slo_class: deadline_sensitive
    request_anchors:
      per_call_input_tokens: {p50: 512, p95: 2048}
      per_call_output_tokens: {p50: 24, p95: 80}
    nodes:
      intent: {type: llm, input_tokens: {p50: 512, p95: 2048}, output_tokens: {p50: 24, p95: 80}}
      db_single: {type: stateless_service, mean_service_seconds: 0.12, return_tokens: {p50: 160, p95: 700}}
      api_single: {type: stateless_service, mean_service_seconds: 0.35, return_tokens: {p50: 160, p95: 700}}
      db_chain: {type: stateless_service, mean_service_seconds: 0.12, return_tokens: {p50: 160, p95: 700}}
      api_chain: {type: stateless_service, mean_service_seconds: 0.35, return_tokens: {p50: 160, p95: 700}}
      verification: {type: llm, input_tokens: {p50: 1080, p95: 3300}, output_tokens: {p50: 32, p95: 96}}
      compensation: {type: stateless_service, mean_service_seconds: 0.20, return_tokens: {p50: 96, p95: 320}}
      final: {type: llm, input_tokens: {p50: 1400, p95: 4200}, output_tokens: {p50: 128, p95: 512}}
    choices:
      - llm_node: intent
        options:
          - {probability: 0.55, chains: [[db_single, verification]]}
          - {probability: 0.30, chains: [[api_single, verification]]}
          - {probability: 0.15, chains: [[db_chain, api_chain, verification]]}
      - llm_node: verification
        options:
          - {probability: 0.75, chains: [[final]]}
          - {probability: 0.25, chains: [[compensation, final]]}

  deep_research:
    label: Deep Research Agent
    slo_class: compound
    request_anchors:
      cumulative_input_tokens: {p50: 10807, p95: 29282}
      cumulative_output_tokens: {p50: 3148, p95: 7525}
    nodes:
      planning: {type: llm, input_tokens: {p50: 512, p95: 2048}, output_tokens: {p50: 128, p95: 512}}
      search_a: {type: stateless_service, mean_service_seconds: 1.8, return_tokens: {p50: 900, p95: 2800}}
      search_b: {type: stateless_service, mean_service_seconds: 2.2, return_tokens: {p50: 900, p95: 2800}}
      draft_a: {type: llm, input_tokens: {p50: 2800, p95: 8500}, output_tokens: {p50: 620, p95: 1800}}
      draft_b: {type: llm, input_tokens: {p50: 3100, p95: 9200}, output_tokens: {p50: 560, p95: 1700}}
      reflection: {type: llm, input_tokens: {p50: 7500, p95: 22000}, output_tokens: {p50: 520, p95: 1600}}
      targeted_search_a: {type: stateless_service, mean_service_seconds: 1.2, return_tokens: {p50: 700, p95: 2200}}
      targeted_search_b: {type: stateless_service, mean_service_seconds: 1.5, return_tokens: {p50: 700, p95: 2200}}
      refinement: {type: llm, input_tokens: {p50: 12000, p95: 30000}, output_tokens: {p50: 720, p95: 2200}}
      summary: {type: llm, input_tokens: {p50: 14500, p95: 32000}, output_tokens: {p50: 650, p95: 2000}}
    mandatory_parallel:
      - llm_node: planning
        branches:
          - [search_a, draft_a]
          - [search_b, draft_b]
        join_node: reflection
    choices:
      - llm_node: reflection
        options:
          - {probability: 0.65, chains: [[summary]]}
          - probability: 0.35
            parallel_branches:
              - [targeted_search_a]
              - [targeted_search_b]
            join_chain: [refinement, summary]

  coding_agent:
    label: Coding Agent
    slo_class: compound
    request_anchors:
      initial_input_tokens: {p50: 1097, p95: 2767}
      cumulative_output_tokens: {p50: 4417, p95: 6452}
      late_context_tokens: {p50: 15000, p95: 32000}
    nodes:
      analysis: {type: llm, input_tokens: {p50: 1300, p95: 2767}, output_tokens: {p50: 700, p95: 1800}}
      read_repository: {type: stateless_service, mean_service_seconds: 0.18, return_tokens: {p50: 1200, p95: 5000}}
      symbol_search: {type: stateless_service, mean_service_seconds: 0.12, return_tokens: {p50: 500, p95: 1800}}
      diagnosis: {type: llm, input_tokens: {p50: 4200, p95: 12000}, output_tokens: {p50: 900, p95: 2400}}
      edit_first: {type: stateless_service, mean_service_seconds: 0.08, return_tokens: {p50: 80, p95: 240}}
      test_first: {type: stateless_service, mean_service_seconds: 2.5, return_tokens: {p50: 400, p95: 1600}}
      review: {type: llm, input_tokens: {p50: 8500, p95: 22000}, output_tokens: {p50: 800, p95: 2100}}
      read_test_logs: {type: stateless_service, mean_service_seconds: 0.12, return_tokens: {p50: 400, p95: 1600}}
      debug: {type: llm, input_tokens: {p50: 12500, p95: 30000}, output_tokens: {p50: 1100, p95: 3000}}
      edit_retry: {type: stateless_service, mean_service_seconds: 0.08, return_tokens: {p50: 80, p95: 240}}
      test_retry: {type: stateless_service, mean_service_seconds: 2.5, return_tokens: {p50: 400, p95: 1600}}
      final: {type: llm, input_tokens: {p50: 15000, p95: 32000}, output_tokens: {p50: 850, p95: 2400}}
    mandatory_parallel:
      - llm_node: analysis
        branches:
          - [read_repository]
          - [symbol_search]
        join_node: diagnosis
    mandatory_chain: [diagnosis, edit_first, test_first, review]
    choices:
      - llm_node: review
        options:
          - {probability: 0.60, chains: [[final]]}
          - {probability: 0.40, chains: [[read_test_logs, debug, edit_retry, test_retry, final]]}
