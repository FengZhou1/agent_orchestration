[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-orchestration-sim"
version = "0.1.0"
description = "Reproducible simulator for joint LLM-tool deployment and routing."
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "pandas>=2.2",
  "networkx>=3.2",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
rl = ["torch>=2.3", "gymnasium>=0.29"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
plot = ["matplotlib>=3.8", "seaborn>=0.13"]

[project.scripts]
agent-orch-sim = "agent_orch.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
